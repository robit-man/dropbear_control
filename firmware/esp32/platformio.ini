; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
	-O2
	-DCORE_DEBUG_LEVEL=3
	-DBOARD_HAS_PSRAM
	-DPROTOCOL_CAN_BUS
	-DPROTOCOL_RS485
	-DPROTOCOL_ETHERCAT
	-DMOTOR_RMD_X
	-DMOTOR_RH
	-DMOTOR_CEM
	-DMOTOR_RMD_H
	-DMOTOR_RMD_L
	-DMOTOR_SERIES=MOTOR_SERIES_RMD_X
	-DMOTOR_SERIES_NAME="RMD_X"
	-DPROTOCOL=PROTOCOL_CAN
	-DPROTOCOL_NAME="CAN"
	-DENCODER_BITS=17
	-DPOWER_CLASS=5
	-DGEARBOX_TYPE=PLANETARY
	-DHAS_BRAKE=false
	-DDRIVE_TYPE=STANDARD
	-DCOMMUNICATION=COMM_CAN
lib_deps = 
	sandeepmistry/CAN@^0.3.1
	bblanchon/ArduinoJson@^6.21.6
	watterott/MCP2515@^1.0.0

