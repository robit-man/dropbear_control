# Keep each management address bound to its physical ingress interface.
# This prevents the healthy Wi-Fi recovery path from inheriting a wedged
# Ethernet adapter when both interfaces share the same IPv4 subnet.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_announce = 2
